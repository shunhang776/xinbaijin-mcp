name: baijin-repair-bridge

on:
  push:
    branches:
      - dev
    paths:
      - "review.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Run repair bridge
        shell: pwsh
        run: ./scripts/repair-bridge.ps1 -RepoRoot ${{ github.workspace }} -ExpectedRepository ${{ github.repository }} -Branch dev

      - name: Upload repair artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-bridge-output
          path: .baijin/repair-bridge/
          retention-days: 7
